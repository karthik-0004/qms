name: platform

x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LOG_LEVEL: "INFO"
  JSON_LOGS: "true"
  RAINER_ENV: "development"
  JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
  JWT_ALGORITHM: "HS256"
  DB_POOL_SIZE: "3"
  DB_MAX_OVERFLOW: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - rainer-net
  mem_limit: 512m
  mem_reservation: 256m

networks:
  rainer-net:
    name: rainer-net
    external: true

services:
  # ── Init Containers ────────────────────────────────────────

  auth-service-init:
    build:
      context: .
      dockerfile: backend/platform/auth-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      AUTH_SUPERADMIN_EMAIL: "admin@rainertek.com"
      AUTH_SUPERADMIN_PASSWORD: "RainerAdmin123!"
      SERVICE_NAME: "auth-service"
      SERVICE_VERSION: "0.1.0"
    command: >
      sh -lc "set -e; alembic upgrade head; python -m app.scripts.create_super_admin"

  tenant-service-init:
    build:
      context: .
      dockerfile: backend/platform/tenant-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      POSTGRES_ADMIN_URL: "postgresql://rainer:rainer_dev_password@postgres:5432/postgres"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "tenant-service"
      SERVICE_VERSION: "0.1.0"
    command: >
      sh -lc "set -e; alembic upgrade head"

  notification-service-init:
    build:
      context: .
      dockerfile: backend/platform/notification-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "notification-service"
      SERVICE_VERSION: "0.1.0"
    command: >
      sh -lc "alembic upgrade head || alembic stamp head"

  # ── Web Services ───────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: backend/platform/auth-service/Dockerfile
    <<: *service-defaults
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      ALLOW_RESERVED_EMAIL_DOMAINS: "true"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "auth-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health/live || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # Idempotent Acme + tenantadmin@acme.com (see auth-service bootstrap_local_tenant_admin).
  platform-dev-login-seed:
    build:
      context: .
      dockerfile: backend/platform/auth-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "platform-dev-login-seed"
      DEV_TENANTADMIN_EMAIL: "tenantadmin@acme.com"
      DEV_TENANTADMIN_PASSWORD: "TenantAdmin1"
      DEV_BOOTSTRAP_TENANT_SLUG: "acme"
      DEV_BOOTSTRAP_TENANT_NAME: "Acme Corporation"
      DEV_TENANTADMIN_ROLE: "tenant_admin"
    command: >
      sh -lc "set -e; python -m app.scripts.bootstrap_local_tenant_admin"

  tenant-service:
    build:
      context: .
      dockerfile: backend/platform/tenant-service/Dockerfile
    <<: *service-defaults
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      POSTGRES_ADMIN_URL: "postgresql://rainer:rainer_dev_password@postgres:5432/postgres"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      USER_SERVICE_URL: "http://user-service:8003"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8005"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      PUBLIC_WEB_LOGIN_URL: "${PUBLIC_WEB_LOGIN_URL:-http://localhost:3000/login}"
      SERVICE_NAME: "tenant-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8002"

  user-service:
    build:
      context: .
      dockerfile: backend/platform/user-service/Dockerfile
    <<: *service-defaults
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      TENANT_SERVICE_URL: "http://tenant-service:8002"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "user-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8003"

  audit-service:
    build:
      context: .
      dockerfile: backend/platform/audit-service/Dockerfile
    <<: *service-defaults
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "audit-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8004"

  notification-service:
    build:
      context: .
      dockerfile: backend/platform/notification-service/Dockerfile
    <<: *service-defaults
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_START_TLS: "${SMTP_START_TLS:-false}"
      SMTP_USERNAME: "${SMTP_USERNAME:-${SMTP_USER:-}}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-${SMTP_PASS:-}}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-${SMTP_FROM:-noreply@rainer.io}}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Rainer Platform}"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "notification-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8005"

  config-service:
    build:
      context: .
      dockerfile: backend/platform/config-service/Dockerfile
    <<: *service-defaults
    ports:
      - "8006:8006"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "config-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8006"

  workflow-engine:
    build:
      context: .
      dockerfile: backend/platform/workflow-engine/Dockerfile
    <<: *service-defaults
    ports:
      - "8007:8007"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "workflow-engine"
      SERVICE_VERSION: "0.1.0"
      PORT: "8007"

  file-service:
    build:
      context: .
      dockerfile: backend/platform/file-service/Dockerfile
    <<: *service-defaults
    ports:
      - "8009:8009"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_ACCESS_KEY_ID: "rainer_minio"
      S3_SECRET_ACCESS_KEY: "rainer_minio_dev_secret"
      S3_BUCKET_NAME: "rainer-files"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "file-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8009"

  document-service:
    build:
      context: .
      dockerfile: backend/qms/document-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8020:8020"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      WORKFLOW_SERVICE_URL: "http://workflow-engine:8007"
      FILE_SERVICE_URL: "http://file-service:8009"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "document-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8020"

  # ============================================================
  # RainerCCV (CRM, contracts, work orders, billing) — gateway proxies /api/v1/*
  # ============================================================
  crm-service:
    build:
      context: ./backend/ccv/crm-service
      dockerfile: Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8040:8040"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "crm-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8040"

  contract-service:
    build:
      context: .
      dockerfile: backend/ccv/contract-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8041:8041"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "contract-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8041"

  workorder-service:
    build:
      context: .
      dockerfile: backend/ccv/workorder-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8042:8042"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      TECHNICIAN_SERVICE_URL: "http://technician-service:8043"
      SERVICE_NAME: "workorder-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8042"

  technician-service:
    build:
      context: .
      dockerfile: backend/ccv/technician-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8043:8043"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "technician-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8043"

  billing-service:
    build:
      context: ./backend/ccv/billing-service
      dockerfile: Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8044:8044"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      DEFAULT_CURRENCY: "USD"
      PAYMENT_DUE_DAYS: "30"
      SERVICE_NAME: "billing-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8044"

  certificate-service:
    build:
      context: ./backend/ccv/certificate-service
      dockerfile: Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8045:8045"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "certificate-service"
