; ──────────────────────────────────────────────────────────────
; PgBouncer configuration for Rainer Platform
; Sits between application services and PostgreSQL 16
; ──────────────────────────────────────────────────────────────

[databases]
; Master database
rainer_master = host=postgres port=5432 dbname=rainer_master

; Tenant databases are added dynamically via the auth_query
; or by appending entries here during tenant provisioning.
; Example:
; tenant_abc = host=postgres port=5432 dbname=tenant_abc

* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
; Alternatively use auth_query for dynamic lookups:
; auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

; Pool mode: transaction is best for short-lived FastAPI async requests
pool_mode = transaction

; Pool sizing
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 500
max_db_connections = 100

; Timeouts
server_connect_timeout = 15
server_login_retry = 3
query_timeout = 120
query_wait_timeout = 30
client_idle_timeout = 600
server_idle_timeout = 300
server_lifetime = 3600

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
verbose = 0

; TLS (enable in production)
; client_tls_sslmode = require
; client_tls_cert_file = /etc/pgbouncer/server.crt
; client_tls_key_file = /etc/pgbouncer/server.key
; server_tls_sslmode = verify-full
; server_tls_ca_file = /etc/pgbouncer/ca.crt

; Admin access
admin_users = rainer_admin
stats_users = rainer_monitor
