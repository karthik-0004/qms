[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "technician-service"
version = "0.1.0"
description = "RainerCCV Technician Service — technician profiles, certifications, availability"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "redis[hiredis]==5.2.0",
    "aiokafka==0.11.0",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
]
