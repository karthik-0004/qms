apiVersion: v2
name: rainer-platform
description: Rainer Platform — Multi-product SaaS microservices (Phase A-D)
type: application
version: 0.4.0
appVersion: "1.0.0"
keywords:
  - rainer
  - qms
  - em
  - ccv
  - biotech
  - saas
home: https://rainertek.com
maintainers:
  - name: RainerTek Engineering
    email: engineering@rainertek.com
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "26.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
