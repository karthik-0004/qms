[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainer-cache"
version = "0.1.0"
description = "Shared Redis caching library for Rainer Platform services"
requires-python = ">=3.12"
dependencies = [
    "redis[hiredis]>=5.0",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rainer_cache"]
