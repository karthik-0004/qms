      - auth-service
      - redis
      - crm-service
      - contract-service
      - workorder-service
      - technician-service
      - billing-service
      - certificate-service
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      AUTH_SERVICE_URL: "http://auth-service:8001"
      TENANT_SERVICE_URL: "http://tenant-service:8002"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8005"
      CRM_SERVICE_URL: "http://crm-service:8040"
      CONTRACT_SERVICE_URL: "http://contract-service:8041"
      WORKORDER_SERVICE_URL: "http://workorder-service:8042"
      TECHNICIAN_SERVICE_URL: "http://technician-service:8043"
      BILLING_SERVICE_URL: "http://billing-service:8044"
      CERTIFICATE_SERVICE_URL: "http://certificate-service:8045"
      DOCUMENT_SERVICE_URL: "http://document-service:8020"
      QUALITY_EVENT_SERVICE_URL: "http://quality-event-service:8021"
      CAPA_SERVICE_URL: "http://capa-service:8022"
      TRAINING_SERVICE_URL: "http://training-service:8023"
      EQUIPMENT_SERVICE_URL: "http://equipment-service:8024"
      ANALYTICS_SERVICE_URL: "http://analytics-service:8011"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "gateway-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8000"
