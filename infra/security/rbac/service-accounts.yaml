# ──────────────────────────────────────────────────────────────
# Kubernetes RBAC manifests for Rainer Platform
# Standalone manifests (in addition to Helm-generated RBAC)
# ──────────────────────────────────────────────────────────────

# ── Platform namespace ────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rainer-platform-sa
  namespace: rainer-platform
  labels:
    app.kubernetes.io/part-of: rainer-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rainer-platform-role
  namespace: rainer-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rainer-platform-binding
  namespace: rainer-platform
subjects:
  - kind: ServiceAccount
    name: rainer-platform-sa
    namespace: rainer-platform
roleRef:
  kind: Role
  name: rainer-platform-role
  apiGroup: rbac.authorization.k8s.io

