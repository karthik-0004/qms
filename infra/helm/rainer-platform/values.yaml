# ─── Infra dependencies ─────────────────────────────────────────────────────

postgresql:
  enabled: false
  auth:
    postgresPassword: "change-in-production"
    database: rainer_master

redis:
  enabled: false
  auth:
    enabled: true
    password: "change-in-production"

kafka:
  enabled: false

# ─── External secrets (HashiCorp Vault) ─────────────────────────────────────

vault:
  enabled: true
  address: "https://vault.rainertek.internal:8200"
  role: "rainer-platform"
  secretPath: "secret/rainer"

# ─── Network policies ────────────────────────────────────────────────────────

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: rainer-platform
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ingress
