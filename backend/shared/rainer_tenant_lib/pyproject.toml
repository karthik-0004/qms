[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainer-tenant-lib"
version = "0.1.0"
description = "Tenant resolver and connection pool management for Rainer Platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
    "rainer-common>=0.1.0",
]

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rainer_tenant_lib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
