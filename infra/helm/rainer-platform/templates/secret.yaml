{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- include "rainer-platform.labels" $ | nindent 4 }}
  annotations:
    # In production, replace with ExternalSecrets or Vault Agent injector
    meta.helm.sh/release-name: {{ $.Release.Name }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://rainer:CHANGE_ME@postgres:5432/rainer_master"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
  RAINER_MASTER_SECRET: "CHANGE_ME_IN_PRODUCTION"
  {{- if or (eq $name "auth-service") (eq $name "gateway-service") (eq $name "file-service") }}
  JWT_SECRET_KEY: "CHANGE_ME_MIN_32_CHARS_IN_PRODUCTION"
  {{- end }}
  {{- if eq $name "gateway-service" }}
  AUTH_SERVICE_URL: "http://auth-service:8001"
  TENANT_SERVICE_URL: "http://tenant-service:8002"
  USER_SERVICE_URL: "http://user-service:8003"
  AUDIT_SERVICE_URL: "http://audit-service:8004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8005"
  DOCUMENT_SERVICE_URL: "http://document-service:8020"
  CRM_SERVICE_URL: "http://crm-service:8040"
  CONTRACT_SERVICE_URL: "http://contract-service:8041"
  WORKORDER_SERVICE_URL: "http://workorder-service:8042"
  TECHNICIAN_SERVICE_URL: "http://technician-service:8043"
  BILLING_SERVICE_URL: "http://billing-service:8044"
  {{- end }}
  {{- if or (eq $name "file-service") (eq $name "reporting-service") (eq $name "image-service") (eq $name "ai-service") }}
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"
  {{- end }}
{{- end }}
