# ── ClusterRole for cross-namespace service discovery ─────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rainer-service-discovery
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rainer-service-discovery-binding
subjects:
  - kind: ServiceAccount
    name: rainer-platform-sa
    namespace: rainer-platform
  - kind: ServiceAccount
    name: rainer-qms-sa
    namespace: rainer-qms
  - kind: ServiceAccount
    name: rainer-em-sa
    namespace: rainer-em
  - kind: ServiceAccount
    name: rainer-ccv-sa
    namespace: rainer-ccv
roleRef:
  kind: ClusterRole
  name: rainer-service-discovery
  apiGroup: rbac.authorization.k8s.io
