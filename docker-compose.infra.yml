name: infra

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    rainer-net:
      aliases:
        - ${SERVICE_NAME}

networks:
  rainer-net:
    name: rainer-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  vault_data:

services:
  postgres:
    image: postgres:16-alpine
    <<: *service-defaults
    mem_limit: 1g
    environment:
      SERVICE_NAME: postgres
      POSTGRES_USER: rainer
      POSTGRES_PASSWORD: rainer_dev_password
      POSTGRES_DB: rainer_master
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rainer -d rainer_master" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *service-defaults
    mem_limit: 256m
    environment:
      SERVICE_NAME: redis
    command: redis-server --requirepass rainer_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "rainer_redis_dev", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    <<: *service-defaults
    environment:
      SERVICE_NAME: zookeeper
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - kafka_data:/var/lib/zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    <<: *service-defaults
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      SERVICE_NAME: kafka
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
    ports:
      - "9092:9092"
      - "9093:9093"
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc \"echo > /dev/tcp/localhost/29092\"" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    <<: *service-defaults
    environment:
      SERVICE_NAME: schema-registry
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"

  minio:
    image: minio/minio:latest
    <<: *service-defaults
    mem_limit: 256m
    environment:
      SERVICE_NAME: minio
      MINIO_ROOT_USER: rainer_minio
      MINIO_ROOT_PASSWORD: rainer_minio_dev_secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3

  vault:
    image: hashicorp/vault:1.17
    <<: *service-defaults
    environment:
      SERVICE_NAME: vault
      VAULT_DEV_ROOT_TOKEN_ID: rainer-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
