version: "3.9"

# ============================================================
# Rainer Platform — Lightweight Development Stack
# Usage:
#   docker compose -f docker-compose.dev.yml --profile platform up -d
#   docker compose -f docker-compose.dev.yml --profile qms up -d
#   docker compose -f docker-compose.dev.yml --profile platform --profile qms up -d
#   docker compose -f docker-compose.dev.yml --profile em up -d
#   docker compose -f docker-compose.dev.yml --profile ccv up -d
#
# Infrastructure (postgres, redis, kafka, etc.) starts automatically
# with any profile. To stop: docker compose -f docker-compose.dev.yml down
# ============================================================

x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LOG_LEVEL: "INFO"
  JSON_LOGS: "true"
  RAINER_ENV: "development"
  JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
  JWT_ALGORITHM: "HS256"
  DB_POOL_SIZE: "3"
  DB_MAX_OVERFLOW: "5"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - rainer-net
  mem_limit: 512m
  mem_reservation: 256m

networks:
  rainer-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  vault_data:

services:
  # ============================================================
  # INFRASTRUCTURE SERVICES (always started with any profile)
  # ============================================================

  postgres:
    image: postgres:16-alpine
    <<: *service-defaults
    mem_limit: 1g
    environment:
      POSTGRES_USER: rainer
      POSTGRES_PASSWORD: rainer_dev_password
      POSTGRES_DB: rainer_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rainer -d rainer_master" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *service-defaults
    command: redis-server --requirepass rainer_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "rainer_redis_dev", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    <<: *service-defaults
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - kafka_data:/var/lib/zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    <<: *service-defaults
    mem_limit: 1g
    mem_reservation: 512m
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc \"echo > /dev/tcp/localhost/29092\"" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    <<: *service-defaults
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  minio:
    image: minio/minio:latest
    <<: *service-defaults
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rainer_minio
      MINIO_ROOT_PASSWORD: rainer_minio_dev_secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    <<: *service-defaults
    ports:
      - "1025:1025"
      - "8025:8025"

  vault:
    image: hashicorp/vault:1.17
    <<: *service-defaults
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: rainer-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    volumes:
      - vault_data:/vault/data

  kafka-ui:
    profiles: ["debug"]
    image: provectuslabs/kafka-ui:latest
    <<: *service-defaults
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rainer-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ============================================================
  # PLATFORM DOMAIN SERVICES
  # Profile: --profile platform
  # ============================================================

  auth-service-init:
    profiles: ["platform", "qms"]
    build:
      context: .
      dockerfile: backend/platform/auth-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      AUTH_SUPERADMIN_EMAIL: "admin@rainertek.com"
      AUTH_SUPERADMIN_PASSWORD: "RainerAdmin123!"
      SERVICE_NAME: "auth-service"
      SERVICE_VERSION: "0.1.0"
    command: >
      sh -lc "set -e; alembic upgrade head; python -m app.scripts.create_super_admin"

  tenant-service-init:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/tenant-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      POSTGRES_ADMIN_URL: "postgresql://rainer:rainer_dev_password@postgres:5432/postgres"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "tenant-service"
      SERVICE_VERSION: "0.1.0"
    command: >
      sh -lc "set -e; alembic upgrade head"

  platform-dev-login-seed:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/auth-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "platform-dev-login-seed"
      DEV_TENANTADMIN_EMAIL: "tenantadmin@acme.com"
      DEV_TENANTADMIN_PASSWORD: "TenantAdmin1"
      DEV_BOOTSTRAP_TENANT_SLUG: "acme"
      DEV_BOOTSTRAP_TENANT_NAME: "Acme Corporation"
      DEV_TENANTADMIN_ROLE: "tenant_admin"
    command: >
      sh -lc "set -e; python -m app.scripts.bootstrap_local_tenant_admin"

  notification-service-init:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/notification-service/Dockerfile
    <<: *service-defaults
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "notification-service"
      SERVICE_VERSION: "0.1.0"
    command: >
      sh -lc "alembic upgrade head || alembic stamp head"

  auth-service:
    profiles: ["platform", "qms"]
    build:
      context: .
      dockerfile: backend/platform/auth-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service-init:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      ALLOW_RESERVED_EMAIL_DOMAINS: "true"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "auth-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health/live || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  tenant-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/tenant-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-service-init:
        condition: service_completed_successfully
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      POSTGRES_ADMIN_URL: "postgresql://rainer:rainer_dev_password@postgres:5432/postgres"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      USER_SERVICE_URL: "http://user-service:8003"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8005"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      PUBLIC_WEB_LOGIN_URL: "${PUBLIC_WEB_LOGIN_URL:-http://localhost:3000/login}"
      SERVICE_NAME: "tenant-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8002"

  user-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/user-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      TENANT_SERVICE_URL: "http://tenant-service:8002"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "user-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8003"

  audit-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/audit-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "audit-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8004"

  notification-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/notification-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      notification-service-init:
        condition: service_completed_successfully
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_START_TLS: "${SMTP_START_TLS:-false}"
      SMTP_USERNAME: "${SMTP_USERNAME:-${SMTP_USER:-}}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-${SMTP_PASS:-}}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-${SMTP_FROM:-noreply@rainer.io}}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Rainer Platform}"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "notification-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8005"

  config-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/config-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8006:8006"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "config-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8006"

  workflow-engine:
    profiles: ["platform", "qms"]
    build:
      context: .
      dockerfile: backend/platform/workflow-engine/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8007:8007"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "workflow-engine"
      SERVICE_VERSION: "0.1.0"
      PORT: "8007"

  file-service:
    profiles: ["platform", "qms"]
    build:
      context: .
      dockerfile: backend/platform/file-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8009:8009"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_ACCESS_KEY_ID: "rainer_minio"
      S3_SECRET_ACCESS_KEY: "rainer_minio_dev_secret"
      S3_BUCKET_NAME: "rainer-files"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "file-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8009"

  gateway-service:
    profiles: ["platform", "qms"]
    build:
      context: .
      dockerfile: backend/platform/gateway-service/Dockerfile
    <<: *service-defaults
    depends_on:
      - redis
      - auth-service
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      AUTH_SERVICE_URL: "http://auth-service:8001"
      TENANT_SERVICE_URL: "http://tenant-service:8002"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8005"
      CRM_SERVICE_URL: "http://crm-service:8040"
      CONTRACT_SERVICE_URL: "http://contract-service:8041"
      WORKORDER_SERVICE_URL: "http://workorder-service:8042"
      TECHNICIAN_SERVICE_URL: "http://technician-service:8043"
      BILLING_SERVICE_URL: "http://billing-service:8044"
      CERTIFICATE_SERVICE_URL: "http://certificate-service:8045"
      DOCUMENT_SERVICE_URL: "http://document-service:8020"
      QUALITY_EVENT_SERVICE_URL: "http://quality-event-service:8021"
      CAPA_SERVICE_URL: "http://capa-service:8022"
      TRAINING_SERVICE_URL: "http://training-service:8023"
      EQUIPMENT_SERVICE_URL: "http://equipment-service:8024"
      ANALYTICS_SERVICE_URL: "http://analytics-service:8011"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "gateway-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8000"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}"

  schedule-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/schedule-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8008"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "schedule-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8008"

  reporting-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/reporting-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8010:8010"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_ACCESS_KEY_ID: "rainer_minio"
      S3_SECRET_ACCESS_KEY: "rainer_minio_dev_secret"
      S3_REPORTS_BUCKET: "rainer-reports"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      SERVICE_NAME: "reporting-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8010"

  analytics-service:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: backend/platform/analytics-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8011:8011"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
      JWT_SECRET_KEY: "dev-jwt-secret-change-in-production-min-32-chars"
      JWT_ALGORITHM: "HS256"
      SERVICE_NAME: "analytics-service"
      SERVICE_VERSION: "0.1.0"
      PORT: "8011"

  # ============================================================
  # QMS DOMAIN SERVICES
  # Profile: --profile qms
  # ============================================================

  document-service:
    profiles: ["qms"]
    build:
      context: .
      dockerfile: backend/qms/document-service/Dockerfile
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8020:8020"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8020", "--workers", "1"]
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://rainer:rainer_dev_password@postgres:5432/rainer_master"
      REDIS_URL: "redis://:rainer_redis_dev@redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RAINER_MASTER_SECRET: "dev-master-secret-change-in-production"
