[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainer-events"
version = "0.1.0"
description = "Shared Kafka event publishing library for Rainer Platform services"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.10.0",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rainer_events"]
